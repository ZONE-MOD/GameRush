name: Dino Rush - Web and Android builds

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project files
        run: python3 tools/validate_project.py

      - name: Configure online patch URL
        run: python3 tools/configure_build.py

      - name: Import Godot resources
        run: godot --headless --editor --path . --quit

      - name: Export Web build
        run: |
          mkdir -p build/web build/android
          touch build/web/.nojekyll
          godot --headless --path . --export-release "Web" build/web/index.html

      - name: Build online skin patch catalog
        run: python3 tools/build_patch_catalog.py --output build/web/patches/catalog.json

      - name: Export Android debug APK
        run: godot --headless --path . --export-debug "Android" build/android/DinoRush-debug.apk

      - name: Upload web files for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DinoRush-Android-debug
          path: build/android/DinoRush-debug.apk
          if-no-files-found: error
          retention-days: 30

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
